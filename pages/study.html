<main>

<section class="status">

<div class="card fadeIn">

<div class="progress">

<div id="progressBar"></div>

</div>

<p id="scoreText">

0 / 0 正解

</p>

<h2 id="questionNumber">

問題

</h2>

<p id="category">

カテゴリ

</p>

<h3 id="questionText">

問題文

</h3>

<div id="choices">

</div>

<div
id="result"
class="result"
style="display:none;">

<h2 id="resultTitle">

</h2>

<!-- ===================== -->
<!-- 正解の理由（+ 詳しい解説） -->
<!-- ===================== -->

<section class="explanationCard">

<h3>

✅ 正解の理由

</h3>

<p id="correctArea">

</p>

<div id="deepDiveArea">

</div>

</section>

<!-- ===================== -->
<!-- 選択肢解説 -->
<!-- ===================== -->

<section class="explanationCard">

<h3>

📖 各選択肢の解説

</h3>

<div id="choiceArea">

</div>

</section>

<!-- ===================== -->
<!-- 試験ポイント -->
<!-- ===================== -->

<section class="explanationCard">

<h3>

🎯 試験で狙われるポイント

</h3>

<ul id="examArea">

</ul>

</section>

<!-- ===================== -->
<!-- よくある勘違い -->
<!-- ===================== -->

<section class="explanationCard warning">

<h3>

⚠ よくある勘違い

</h3>

<p id="mistakeArea">

</p>

</section>

<!-- ===================== -->
<!-- 類題 -->
<!-- ===================== -->

<section class="explanationCard">

<h3>

📝 類題

</h3>

<ul id="similarArea">

</ul>

</section>

<!-- ===================== -->
<!-- 理解度 -->
<!-- ===================== -->

<section class="understandingCard">

<h3>

今回の理解度

</h3>

<div class="understandingButtons">

<button
id="understandGood"
class="good">

😊 理解できた

</button>

<button
id="understandNormal"
class="normal">

😐 普通

</button>

<button
id="understandBad"
class="bad">

😢 苦手

</button>

</div>

</section>

</div>

<button
id="nextBtn"
class="primaryButton mt20">

次の問題 →

</button>

</div>

</section>
